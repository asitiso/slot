<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#170f24">
  <meta name="description" content="달빛 아래 레버를 당기고, 소원을 담은 전통풍 종이 부적을 한 장 뽑아요.">
  <title>부적 뽑기 · 행운 뽑기</title>
  <link rel="icon" href="assets/lucky-bunny.webp" type="image/webp">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="charm.css">
  <script src="draw-controls.js" defer></script>
  <script src="charm.js" defer></script>
</head>
<body class="charm-page">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="M12 2.5 14.6 9.4 21.5 12l-6.9 2.6-2.6 6.9-2.6-6.9L2.5 12l6.9-2.6L12 2.5Z"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 14.1A8.9 8.9 0 0 1 9.9 3.4a8.9 8.9 0 1 0 10.6 10.7Z"/><path d="M17.8 3v5m-2.5-2.5h5"/></symbol>
    <symbol id="icon-sound" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Zm13 0a4 4 0 0 1 0 6m2.6-8.6a8 8 0 0 1 0 11.2"/></symbol>
    <symbol id="icon-muted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Zm13 1 5 5m0-5-5 5"/></symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11 5v-5h5"/></symbol>
    <symbol id="icon-collapse" viewBox="0 0 24 24"><path d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></symbol>
    <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 15v5h14v-5"/></symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 .5 6m-.5-6V5m0 5h5"/></symbol>
    <symbol id="icon-down" viewBox="0 0 24 24"><path d="M12 4v14m-5-5 5 5 5-5"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <nav class="game-nav" aria-label="뽑기 메뉴">
        <a class="game-link" href="index.html"><span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="#icon-spark"/></svg></span><span>행운 뽑기</span></a>
        <a class="game-link" href="charm.html" aria-current="page">부적 뽑기</a>
      </nav>
      <div class="toolbar">
        <button id="sound" type="button" class="tool-button" aria-label="효과음" aria-pressed="true" title="효과음">
          <svg class="icon" aria-hidden="true"><use href="#icon-sound"/></svg><span>소리 켜짐</span>
        </button>
        <button id="fullscreen" type="button" class="tool-button fullscreen-button" aria-label="전체 화면" title="전체 화면">
          <svg class="icon" aria-hidden="true"><use href="#icon-expand"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="layout charm-layout">
    <div class="intro charm-intro">
      <h1>부적 뽑기<span aria-hidden="true">✦</span></h1>
      <p>소원을 하나 떠올리고 레버를 당겨보세요.</p>
    </div>

    <div class="charm-board">
      <section class="charm-stage" id="charm-stage" aria-labelledby="charm-play-title">
        <h2 class="sr-only" id="charm-play-title">슬롯머신</h2>
        <div class="moon-orbit" aria-hidden="true"></div>
        <span class="night-star night-star-one" aria-hidden="true">✧</span>
        <span class="night-star night-star-two" aria-hidden="true">✦</span>
        <span class="night-star night-star-three" aria-hidden="true">✧</span>
        <span class="night-star night-star-four" aria-hidden="true">✦</span>
        <div class="charm-machine" id="machine">
          <img class="cabinet-art" src="assets/charm/night-cabinet.webp" alt="" draggable="false" fetchpriority="high">
          <div class="charm-reels" aria-hidden="true">
            <div class="charm-reel side-charm-reel"><div class="charm-back"><span>✧</span></div><img alt="" hidden></div>
            <div class="charm-reel center-charm-reel"><div class="charm-back"><span>☾</span></div><img alt="" hidden></div>
            <div class="charm-reel side-charm-reel"><div class="charm-back"><span>✧</span></div><img alt="" hidden></div>
          </div>
          <div class="charm-lever-mount" aria-hidden="true"></div>
          <div class="charm-lever-arm" aria-hidden="true"></div>
          <button id="lever" class="charm-lever" type="button" aria-label="레버 당겨서 부적 뽑기"><span aria-hidden="true"></span></button>
          <span class="charm-pull-label" aria-hidden="true"><svg class="icon"><use href="#icon-down"/></svg>당겨요</span>
          <span class="reveal-flare" aria-hidden="true"></span>
        </div>
        <div class="charm-play-controls">
          <p id="play-status" class="charm-play-status">레버를 당겨 부적 한 장을 뽑아요.</p>
          <button id="draw" type="button" class="button charm-draw-button"><svg class="icon" aria-hidden="true"><use href="#icon-spark"/></svg><span>부적 뽑기</span></button>
          <p class="keyboard-hint"><kbd>Space</kbd> 키로도 뽑을 수 있어요</p>
        </div>
      </section>

      <section class="charm-result" id="charm-result" aria-labelledby="result-title">
        <div class="result-heading"><svg class="icon" aria-hidden="true"><use href="#icon-moon"/></svg><h2 id="result-title">뽑은 부적</h2></div>
        <div class="result-display">
          <div class="result-orbit" aria-hidden="true"></div>
          <span class="result-star result-star-left" aria-hidden="true">✦</span><span class="result-star result-star-right" aria-hidden="true">✧</span>
          <div id="result-back" class="charm-back result-back" aria-hidden="true"><span>☾</span></div>
          <img id="result-art" alt="" hidden>
        </div>
        <div class="result-content" role="status" aria-atomic="true">
          <p id="result-category" class="result-category" hidden></p>
          <h3 id="result-name">어떤 부적이 나올까요?</h3>
          <p id="result-message" class="result-message">뽑은 부적은 이미지로 간직할 수 있어요.</p>
        </div>
        <a id="charm-download" class="button charm-download" download hidden><svg class="icon" aria-hidden="true"><use href="#icon-download"/></svg>이미지 저장</a>
      </section>
    </div>

    <section class="charm-catalog" aria-labelledby="catalog-title">
      <div class="catalog-heading">
        <h2 id="catalog-title" tabindex="-1">봉인된 부적 <span id="catalog-count">0 / 8 공개</span></h2>
        <button id="charm-reset" class="reset-button catalog-reset" type="button" disabled><svg class="icon" aria-hidden="true"><use href="#icon-reset"/></svg>부적 초기화</button>
      </div>
      <p class="catalog-lead">단서만 살짝 살펴보세요. 뽑은 부적의 봉인이 풀려요.</p>
      <ul id="catalog-list"></ul>
      <p class="charm-credit">한국 전통 부적의 종이와 붓선을 참고해 그린 창작 부적이에요. <a href="https://encykorea.aks.ac.kr/Article/E0024533" target="_blank" rel="noopener">전통 부적 알아보기</a></p>
    </section>
  </main>
</body>
</html>
