<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c1329">
  <meta name="description" content="달빛 슬롯머신에서 메이저 아르카나 타로 세 장을 뽑고 과거, 현재, 미래의 이야기를 읽어요.">
  <title>타로 뽑기 · 행운 뽑기</title>
  <link rel="icon" href="assets/lucky-bunny.webp" type="image/webp">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="charm.css">
  <link rel="stylesheet" href="tarot.css">
  <script src="draw-controls.js" defer></script>
  <script src="tarot-cards.js" defer></script>
  <script src="tarot.js" defer></script>
</head>
<body class="tarot-page">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="M12 2.5 14.6 9.4 21.5 12l-6.9 2.6-2.6 6.9-2.6-6.9L2.5 12l6.9-2.6L12 2.5Z"/></symbol>
    <symbol id="icon-sound" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Zm13 0a4 4 0 0 1 0 6m2.6-8.6a8 8 0 0 1 0 11.2"/></symbol>
    <symbol id="icon-muted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Zm13 1 5 5m0-5-5 5"/></symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11 5v-5h5"/></symbol>
    <symbol id="icon-collapse" viewBox="0 0 24 24"><path d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></symbol>
    <symbol id="icon-down" viewBox="0 0 24 24"><path d="M12 4v14m-5-5 5 5 5-5"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <nav class="game-nav" aria-label="뽑기 메뉴">
        <a class="game-link" href="index.html"><span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="#icon-spark"/></svg></span><span>행운 뽑기</span></a>
        <a class="game-link" href="charm.html">부적 뽑기</a>
        <a class="game-link" href="tarot.html" aria-current="page">타로 뽑기</a>
        <a class="game-link" href="fortune.html">운세 뽑기</a>
      </nav>
      <div class="toolbar">
        <button id="sound" type="button" class="tool-button" aria-label="효과음" aria-pressed="true" title="효과음">
          <svg class="icon" aria-hidden="true"><use href="#icon-sound"/></svg><span>소리 켜짐</span>
        </button>
        <button id="fullscreen" type="button" class="tool-button fullscreen-button" aria-label="전체 화면" title="전체 화면">
          <svg class="icon" aria-hidden="true"><use href="#icon-expand"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="layout tarot-layout">
    <div class="intro tarot-intro">
      <h1>타로 뽑기<span aria-hidden="true">✦</span></h1>
      <p>마음속에 질문 하나를 떠올리고, 레버를 당겨 세 장을 뽑아보세요.</p>
    </div>

    <div class="charm-board tarot-board">
      <section id="tarot-stage" class="charm-stage" aria-labelledby="tarot-play-title">
        <h2 id="tarot-play-title" class="sr-only">타로 슬롯머신</h2>
        <div class="moon-orbit" aria-hidden="true"></div>
        <span class="night-star night-star-one" aria-hidden="true">✦</span>
        <span class="night-star night-star-two" aria-hidden="true">✧</span>
        <span class="night-star night-star-three" aria-hidden="true">✧</span>
        <span class="night-star night-star-four" aria-hidden="true">✦</span>
        <div class="charm-machine" id="machine">
          <img class="cabinet-art" src="assets/tarot/moon-cabinet.webp" alt="" draggable="false" fetchpriority="high">
          <div class="charm-reels tarot-reels" aria-hidden="true">
            <div class="charm-reel tarot-reel"><div class="charm-back"><span>✧</span></div><img alt="" hidden></div>
            <div class="charm-reel tarot-reel"><div class="charm-back"><span>☾</span></div><img alt="" hidden></div>
            <div class="charm-reel tarot-reel"><div class="charm-back"><span>✦</span></div><img alt="" hidden></div>
          </div>
          <div class="charm-lever-mount" aria-hidden="true"></div>
          <div class="charm-lever-arm" aria-hidden="true"></div>
          <button id="lever" class="charm-lever" type="button" aria-label="레버 당겨서 타로 뽑기"><span aria-hidden="true"></span></button>
          <span class="charm-pull-label" aria-hidden="true"><svg class="icon"><use href="#icon-down"/></svg>당겨요</span>
        </div>
        <div class="charm-play-controls">
          <p id="play-status" class="charm-play-status" role="status">왼쪽부터 과거, 현재, 미래의 카드가 나와요.</p>
          <button id="draw" type="button" class="button charm-draw-button"><svg class="icon" aria-hidden="true"><use href="#icon-spark"/></svg><span>카드 세 장 뽑기</span></button>
          <p class="keyboard-hint"><kbd>Space</kbd> 키로도 뽑을 수 있어요</p>
        </div>
      </section>

      <section class="reading-panel" aria-labelledby="reading-title">
        <div class="reading-heading"><span aria-hidden="true">☾</span><h2 id="reading-title">과거 · 현재 · 미래</h2></div>
        <p class="reading-help">카드를 누르면 그림을 크게 볼 수 있어요.</p>
        <ol id="reading-list"></ol>
      </section>
    </div>

    <details class="tarot-gallery">
      <summary>타로 카드 22장 살펴보기</summary>
      <ul id="gallery-list"></ul>
    </details>
  </main>

  <dialog id="tarot-detail" aria-labelledby="detail-name" aria-describedby="detail-text">
    <form method="dialog">
      <div class="dialog-header"><h2 id="detail-name"></h2><button type="submit" class="tool-button" aria-label="닫기" autofocus><svg class="icon" aria-hidden="true"><use href="#icon-close"/></svg></button></div>
      <img id="detail-art" alt="">
      <p id="detail-text"></p>
    </form>
  </dialog>
</body>
</html>
