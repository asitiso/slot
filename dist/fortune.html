<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fefbf1">
  <meta name="description" content="햇살 슬롯머신의 레버를 당겨 오늘의 운세와 행운의 색, 숫자를 뽑아요.">
  <title>운세 뽑기 · 행운 뽑기</title>
  <link rel="icon" href="assets/lucky-bunny.webp" type="image/webp">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="charm.css">
  <link rel="stylesheet" href="fortune.css">
  <script src="draw-controls.js" defer></script>
  <script src="fortune-cards.js" defer></script>
  <script src="fortune.js" defer></script>
</head>
<body class="fortune-page">
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="M12 2.5 14.6 9.4 21.5 12l-6.9 2.6-2.6 6.9-2.6-6.9L2.5 12l6.9-2.6L12 2.5Z"/></symbol>
    <symbol id="icon-sound" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Zm13 0a4 4 0 0 1 0 6m2.6-8.6a8 8 0 0 1 0 11.2"/></symbol>
    <symbol id="icon-muted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3Zm13 1 5 5m0-5-5 5"/></symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11 5v-5h5"/></symbol>
    <symbol id="icon-collapse" viewBox="0 0 24 24"><path d="M4 9h5V4m11 5h-5V4M9 20v-5H4m11 5v-5h5"/></symbol>
    <symbol id="icon-down" viewBox="0 0 24 24"><path d="M12 4v14m-5-5 5 5 5-5"/></symbol>
  </svg>

  <header class="topbar">
    <div class="topbar-inner">
      <nav class="game-nav" aria-label="뽑기 메뉴">
        <a class="game-link" href="index.html"><span class="brand-icon"><svg class="icon" aria-hidden="true"><use href="#icon-spark"/></svg></span><span>행운 뽑기</span></a>
        <a class="game-link" href="charm.html">부적 뽑기</a>
        <a class="game-link" href="tarot.html">타로 뽑기</a>
        <a class="game-link" href="fortune.html" aria-current="page">운세 뽑기</a>
      </nav>
      <div class="toolbar">
        <button id="sound" type="button" class="tool-button" aria-label="효과음" aria-pressed="true" title="효과음">
          <svg class="icon" aria-hidden="true"><use href="#icon-sound"/></svg><span>소리 켜짐</span>
        </button>
        <button id="fullscreen" type="button" class="tool-button fullscreen-button" aria-label="전체 화면" title="전체 화면">
          <svg class="icon" aria-hidden="true"><use href="#icon-expand"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="layout fortune-layout">
    <div class="intro fortune-intro">
      <h1>운세 뽑기<span aria-hidden="true">✦</span></h1>
      <p>햇살 슬롯머신의 레버를 당겨 오늘의 운세를 뽑아보세요.</p>
    </div>

    <div class="charm-board fortune-board">
      <section class="charm-stage fortune-stage" id="fortune-stage" aria-labelledby="fortune-play-title">
        <h2 class="sr-only" id="fortune-play-title">운세 슬롯머신</h2>
        <div class="moon-orbit" aria-hidden="true"></div>
        <span class="night-star night-star-one" aria-hidden="true">✦</span>
        <span class="night-star night-star-two" aria-hidden="true">✧</span>
        <span class="night-star night-star-three" aria-hidden="true">✧</span>
        <span class="night-star night-star-four" aria-hidden="true">✦</span>
        <div class="charm-machine" id="machine">
          <img class="cabinet-art" src="assets/fortune/sunrise-cabinet.webp" alt="" draggable="false" fetchpriority="high">
          <div class="charm-reels fortune-reels" aria-hidden="true">
            <div class="charm-reel fortune-reel"><span>✧</span><img alt="" hidden></div>
            <div class="charm-reel fortune-reel"><span>✦</span><img alt="" hidden></div>
            <div class="charm-reel fortune-reel"><span>✧</span><img alt="" hidden></div>
          </div>
          <div class="charm-lever-mount" aria-hidden="true"></div>
          <div class="charm-lever-arm" aria-hidden="true"></div>
          <button id="lever" class="charm-lever" type="button" aria-label="레버 당겨서 운세 뽑기" disabled><span aria-hidden="true"></span></button>
          <span class="charm-pull-label" aria-hidden="true"><svg class="icon"><use href="#icon-down"/></svg>당겨요</span>
        </div>
        <div class="charm-play-controls">
          <p class="charm-play-status" id="play-status">당길 때마다 다른 운세가 나와요.</p>
          <button id="draw" type="button" class="button charm-draw-button" disabled><svg class="icon" aria-hidden="true"><use href="#icon-spark"/></svg><span>운세 뽑기</span></button>
          <p class="keyboard-hint"><kbd>Space</kbd> 키로도 뽑을 수 있어요</p>
        </div>
      </section>

      <section class="fortune-result" id="fortune-result" aria-labelledby="fortune-title">
        <div class="fortune-heading">
          <span class="fortune-heading-mark" aria-hidden="true"><svg class="icon"><use href="#icon-spark"/></svg></span>
          <h2 id="fortune-title">오늘의 운세</h2>
          <time id="fortune-date"></time>
        </div>

        <div class="fortune-paper" role="status" aria-atomic="true">
          <div class="fortune-emblem" aria-hidden="true">
            <img id="fortune-motif" src="assets/fortune/overall.webp" width="160" height="160" alt="">
          </div>
          <div class="fortune-message">
            <p id="fortune-topic" class="fortune-topic" hidden></p>
            <h3 id="fortune-headline">오늘은 어떤 하루가 될까요?</h3>
            <p id="fortune-copy">총운부터 일·공부운, 애정운까지 여섯 가지 주제 중 하나를 뽑아요.</p>
          </div>
        </div>

        <div class="fortune-extras" id="fortune-extras" hidden>
          <div class="fortune-tip">
            <h4>오늘의 작은 행동</h4>
            <p id="fortune-tip"></p>
          </div>
          <dl class="fortune-luck">
            <div><dt>행운의 색</dt><dd><span class="luck-swatch" id="luck-swatch" aria-hidden="true"></span><span id="luck-color"></span></dd></div>
            <div><dt>행운의 숫자</dt><dd id="luck-number"></dd></div>
          </dl>
        </div>
      </section>
    </div>

    <section class="fortune-topics" aria-labelledby="topics-title">
      <h2 id="topics-title">나올 수 있는 운세</h2>
      <ul id="fortune-topics"></ul>
    </section>
  </main>
</body>
</html>
